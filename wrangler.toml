name = "cfmemos"
main = "worker/src/index.ts"
compatibility_date = "2025-05-01"

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/file/*", "/u/*", "/explore/rss.xml"]

[vars]
INSTANCE_NAME = "cfmemos"
APP_VERSION = "1.0.0"

[[d1_databases]]
binding = "DB"
database_name = "cfmemos-db"
database_id = "711c3042-6d77-413d-8b6a-ecdbdc8ac3ee"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "cfmemos"

# Optional KV cache. Create a namespace with:
#   wrangler kv namespace create cfmemos-cache
# Then uncomment this block and replace the id.
[[kv_namespaces]]
binding = "CACHE"
id = "bccf0a5542874bf4b9de202930ef6db8"

[ai]
binding = "AI"
